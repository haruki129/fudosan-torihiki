    '" stroke="#000" stroke-width="' + line.w + '"' + (line.dash ? ' stroke-dasharray="' + line.dash.join(" ") + '"' : '') + '/>';
}
function buildJuusetsuHtml() {
  const layout = jpTextLayout(), markers = jpTableMarkers();
  return '<div class="jp-print-guide">印刷設定: 背景のグラフィックを有効・余白なし・倍率100%</div>' +
    JUUSETSU_GEOMETRY.pages.map(page => {
      const lines = page.lines.map(jpLineHtml).join("");
      const rects = page.rects.map(r => '<rect x="' + r.x + '" y="' + r.y + '" width="' + r.w + '" height="' + r.h +
        '" fill="' + (r.fill ? '#000' : 'none') + '" stroke="' + (r.fill || r.stroke === false ? 'none' : '#000') + '" stroke-width="' + r.lw + '"/>').join("");
      const curves = page.curves.map(c => '<path d="' + c.pts.map((pt,i) => (i ? 'L' : 'M') + pt.join(' ')).join(' ') + (c.fill ? ' Z' : '') +
        '" fill="' + (c.fill ? '#000' : 'none') + '" stroke="' + (c.fill && c.role !== 'rule' ? 'none' : '#000') + '" stroke-width="' + c.lw + '"/>').join("");
      const strikes = page.strikes.filter(s => s.bind?.key ? jpChoice(s.bind) === s.bind.when : page.no === 1 && s.x1 > JUUSETSU_GEOMETRY.page_size_pt[0] / 2).map(jpLineHtml).join("");
      const fixed = page.static.map(s => '<div class="jp-t"' + (s.w ? ' data-jp-width="' + s.w + '"' : '') +
        ' style="left:' + s.x + 'pt;top:' + s.y + 'pt;font-size:' + s.size + 'pt;' +
        (s.w ? 'display:inline-block;width:' + s.w + 'pt;' : '') + '">' + escapeHtml(s.text) + '</div>').join("");
      const values = page.slots.map(s => {
        const literal = s.id === "p10-t27-0" ? state.deal.common_area_scope_bylaw :
          s.id === "p10-t27-1" ? state.deal.common_share_bylaw :
          s.id === "p3-t11" ? state.rows.unit_floor_areas?.[0]?.floor_part : undefined;
        if (!jpEmpty(literal)) return jpTextHtml({ ...s, align:"left" }, String(literal));
        if (s.kind === "checkbox") return jpChecked(s, page) ? jpTextHtml(s, "■") : "";
        if (markers.has(s.id)) return jpTextHtml(s, "以下余白", layout.values.get(s.id));
        if (s.bind?.table && s.kind !== "strike" && s.bind.row >= jpTableLength(s.bind.table)) return "";
        if (jpIsMultiline(s)) {
          const block = layout.values.get(s.id);
          return block ? jpTextHtml(s, block.text, block) : "";
        }
        return jpTextHtml(s, jpFormat(s));
      }).join("");
      return '<section class="jp-page" data-jp-page="' + page.no + '"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 595 842" aria-hidden="true">' +
        lines + rects + curves + strikes + '</svg>' + fixed + values + '</section>';
    }).join("");
}
function jpFitStatic(view) {
  view.querySelectorAll("[data-jp-width]").forEach(el => {
    const range = document.createRange();
    range.selectNodeContents(el);
    const actual = range.getBoundingClientRect().width;
    const target = Number(el.dataset.jpWidth) * 96 / 72;
    if (actual > target * 1.01) el.style.transform = "scaleX(" + target / actual + ")";
    range.detach();
  });
}
async function jpPrint() {
  const view = document.getElementById("report-view");
  const rule = document.createElement("style");
  rule.id = "jp-page-rule";
  rule.textContent = "@media print { @page { size:A4 portrait; margin:0; } }";
  const cleanup = () => {
    document.body.classList.remove("printing", "printing-juusetsu");
    view.innerHTML = "";
    rule.remove();
    window.onafterprint = null;
  };
  try {
    view.innerHTML = buildJuusetsuHtml();
    document.head.appendChild(rule);
    document.body.classList.add("printing", "printing-juusetsu");
    window.onafterprint = cleanup;
    if (document.fonts) await document.fonts.ready;
    jpFitStatic(view);
    window.print();
  } catch (error) {
    cleanup();
    showToast("印刷ビューを準備できませんでした", "error");
  }
}
function jpOverflowWarnings() {
  const warnings = jpTextLayout().warnings;
  Object.entries(JUUSETSU_GEOMETRY.table_capacity).forEach(([table, capacity]) => {
    const excess = jpTableLength(table) - capacity;
    if (excess <= 0) return;
    const page = JUUSETSU_GEOMETRY.pages.find(p => p.slots.some(s => s.bind?.table === table));
    warnings.push({ page:page.no, label:TABLE_LABELS[table], excess });
  });
  return warnings;
}
function openJuusetsu() {
  const warnings = jpOverflowWarnings();
  if (!warnings.length) { jpPrint(); return; }
  openConfirmModal({
    title:"印刷範囲を超える入力があります",
    message:"",
    cancelLabel:"入力へ戻る",
    confirmLabel:"このまま印刷する",
    onConfirm:jpPrint,
  });
  const list = document.createElement("ul");
  list.className = "jp-overflow-list";
  warnings.forEach(w => {
    const item = document.createElement("li");
    item.textContent = w.page + "ページ目「" + w.label + "」— 入りきりません（" + w.excess + "行超過）";
    list.appendChild(item);
  });
  document.querySelector("#modal-root .modal-message").replaceWith(list);
}

/* =========================================================================
 * トースト
 * ========================================================================= */
function showToast(message, type) {
  const el = document.getElementById("toast");
  el.textContent = message;
  el.className = "toast show" + (type ? (" toast-" + type) : "");
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.classList.remove("show"); }, 4200);
}

/* =========================================================================
 * イベント委譲
 * ========================================================================= */
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;
  switch (action) {
    case "new-deal": newDeal(); showEditView(); break;
    case "open-deal": { const id = Number(el.dataset.id); loadDeal(id).then(() => showEditView()); break; }
    case "delete-deal": { const id = Number(el.dataset.id); openDeleteModal(id); break; }
    case "export-backup": performExport(); break;
    case "import-backup-open": openImportModal(); break;
    case "tab": switchTab(el.dataset.tab); break;
    case "jump-to": scrollToHeading(el.dataset.target); break;
    case "add-row": {
      const table = el.dataset.table;
      const max = MAX_ROWS_BY_TABLE[table];
      if (max && state.rows[table].length >= max) break;
      state.rows[table].push(blankRow(table, state.rows[table].length + 1));
      state.dirty = true;
      replaceRowsBlock(table);
      break;
    }
    case "remove-row": {
      const table = el.dataset.table;
      const uid = el.dataset.uid;
      state.rows[table] = state.rows[table].filter(r => String(r._uid) !== String(uid));
      state.rows[table].forEach((r, i) => { r.row_no = i + 1; });
      state.dirty = true;
      replaceRowsBlock(table);
      break;
    }
    case "save-deal": performSave(); break;
    case "back-to-list": if (state.dirty) { openDiscardModal(); } else { showListView(); } break;
    case "modal-confirm": { const fn = pendingModalAction; closeModal(); if (fn) fn(); break; }
    case "modal-cancel": closeModal(); break;
    case "copy-backup-json": copyBackupJson(); break;
    case "do-import-paste": doImportPaste(); break;
    case "report-blank": openReport("blank"); break;
    case "report-filled": openReport("filled"); break;
    case "report-juusetsu": openJuusetsu(); break;
  }
});

document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.tagName === "TEXTAREA") autosize(t);
  if (t.dataset && t.dataset.scope) handleFieldInput(t);
});
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.dataset && t.dataset.scope) handleFieldInput(t);
});
document.addEventListener("focusin", (e) => {
  if (e.target.matches && e.target.matches(".input-money")) onMoneyFocus(e.target);
});
document.addEventListener("focusout", (e) => {
  if (e.target.matches && e.target.matches(".input-money")) onMoneyBlur(e.target);
});
document.addEventListener("keydown", (e) => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches("tr.list-row")) {
    e.preventDefault();
    e.target.click();
  }
  if (e.key === "Escape") {
    const root = document.getElementById("modal-root");
    if (root && root.innerHTML.trim() !== "") closeModal();
  }
  if (e.key === "Tab") {
    const box = document.querySelector(".modal-box");
    if (!box) return;
    const list = getFocusableInModal(box);
    if (!list.length) return;
    const first = list[0], last = list[list.length - 1];
    if (e.shiftKey && document.activeElement === first) {
      e.preventDefault(); last.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault(); first.focus();
    }
  }
});

/* =========================================================================
 * 起動
 * ========================================================================= */
window.addEventListener("DOMContentLoaded", async () => {
  try {
    await openDB();
    showListView();
  } catch (err) {
    document.getElementById("app").innerHTML =
      '<div class="container"><p class="empty-msg">データベースの初期化に失敗しました: ' + escapeHtml(err && err.message || String(err)) + '</p></div>';
  }
});

/* =========================================================================
 * テスト用フック（検証担当が使用）
 * ========================================================================= */
window.__app = {
  schema: SCHEMA,
  getDb: () => db,
  state,
  idbGetAll, idbGet, idbGetAllByIndex,
  newDeal, loadDeal, performSave, actuallyDeleteDeal,
  gatherBackupData, importData,
  recomputeAllComputed, evalComputedTokens, tokenizeFormula,
  applyShowifCascade, applyAllShowifs, isShowifVisible,
  formatMoney, formatDateTime,
  showListView, showEditView, switchTab, renderList,
  ROW_TABLES, FIXED_TABLES, ALL_STORES, MAX_ROWS_BY_TABLE, TABLE_NOTE_BY_TABLE,
  CHECKLIST_DEFS, COMPUTED_DEFS, SHOWIF_BY_DRIVER, DEAL_FIELD_DEFS, FIXED_ORDER_BY_TABLE,
};
