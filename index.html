<!DOCTYPE html>
<html lang="ja">
<head>
<!-- 不動産取引システム v0.5.1 / docs/02_項目定義_schema_v0.5.json（FRK標準書式「一般仲介用・区分所有建物（敷地権型）」重要事項説明書 全25p 準拠）に基づく。承認③: 2026-09-08。
     v0.2.0からの引き継ぎ: 横展開レイアウト・一覧画面・保存/読込/削除カスケード/バックアップ・モーダル3種・aria対応・IndexedDBのみ・alert等不使用。
     v0.3.0で追加: SCHEMA差し替え（366 field / 15テーブル / チェックリスト3件107項目）、IndexedDB v2（既存ストア維持＋新規9ストア追加）、
     checklist描画、showif条件表示、note注記、computed複数対応（連鎖計算）、land_parcelsのmax_rows、重説タブの章ジャンプバー。
     v0.3.1で修正: 見出し二重描画・見出しとchecklistの順序逆転を解消、showifの推移的（再帰的）非表示判定、
     select/yesnoの範囲外の旧データ値を「（旧データ）」付きで表示、land_parcelsの上限注記を常時表示。
     v0.4.0: 重要事項調査報告書の依頼書（空欄）／控え（記入済み）出力を追加。データ構造の変更なし。承認: 2026-09-08。
     v0.5.0: 重要事項説明書（FRK標準書式）25ページの書面出力を追加。buyer_name追加・area_district_checks 2項目追加。承認: 2026-09-09
     v0.5.1: r3修正（p19「売買代金の％相当額」を10%/20%とも■、共用部分規約2欄・階部分の描画を明示）。本番OK: 2026-09-09 -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>不動産取引システム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F7F5;
    --surface:#FFFFFF;
    --ink:#1F2A24;
    --muted:#6B7570;
    --line:#D9DED9;
    --indigo:#2B4C7E;
    --indigo-soft:#E4EAF3;
    --seal:#B8433A;
    --ok:#2F6B4F;
    --font-heading:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
    --font-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:15px;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,p{ margin:0; }
  button{ font:inherit; }
  table{ border-collapse:collapse; border-spacing:0; }
  .num{ font-variant-numeric:tabular-nums; }
  [hidden]{ display:none !important; }

  /* ---- layout shells ---- */
  .container{ max-width:1120px; margin:0 auto; padding:20px; }
  header.topbar{ background:var(--surface); border-bottom:1px solid var(--line); }
  .topbar-inner{ max-width:1120px; margin:0 auto; padding:16px 20px; display:flex; align-items:baseline; gap:10px; }
  .brand-name{ font-family:var(--font-heading); font-weight:700; font-size:1.25rem; color:var(--ink); }
  .brand-version{ color:var(--muted); font-size:0.8rem; font-variant-numeric:tabular-nums; }

  /* ---- buttons ---- */
  .btn{
    font-family:var(--font-body); font-weight:700; font-size:0.9rem;
    padding:10px 18px; border-radius:8px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink); cursor:pointer;
    transition:background .15s ease, border-color .15s ease, color .15s ease;
  }
  .btn:hover{ background:var(--indigo-soft); }
  .btn-primary{ background:var(--indigo); border-color:var(--indigo); color:#fff; }
  .btn-primary:hover{ background:#243f68; border-color:#243f68; }
  .btn-danger{ background:var(--seal); border-color:var(--seal); color:#fff; }
  .btn-danger:hover{ background:#973530; border-color:#973530; }
  .btn-ghost{ background:transparent; }
  .btn-sm{ padding:6px 12px; font-size:0.8rem; border-radius:6px; }
  .btn-add{ margin-top:8px; }
  .btn:disabled{ opacity:0.5; cursor:not-allowed; }
  .btn:disabled:hover{ background:var(--surface); }
  .btn-primary:disabled:hover{ background:var(--indigo); }

  /* ---- list screen ---- */
  .toolbar{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; }
  .empty-msg{ color:var(--muted); text-align:center; padding:60px 20px; font-size:1rem; }
  .rows-wrap{ overflow-x:auto; border:1px solid var(--line); border-radius:10px; background:var(--surface); }
  table.list-table{ width:100%; min-width:max-content; }
  table.rows-table{ width:100%; table-layout:fixed; }
  table.list-table th, table.list-table td,
  table.rows-table th, table.rows-table td{
    border-bottom:1px solid var(--line); padding:10px 14px; text-align:left; white-space:nowrap;
  }
  table.list-table thead th, table.rows-table thead th{
    background:var(--indigo-soft); color:var(--ink); font-weight:700; font-size:0.85rem;
  }
  table.list-table tbody tr:last-child td, table.rows-table tbody tr:last-child td{ border-bottom:none; }
  tr.list-row{ cursor:pointer; }
  tr.list-row:hover{ background:var(--indigo-soft); }
  td.muted{ color:var(--muted); }
  td.small{ font-size:0.8rem; }
  td.col-action, th.col-action{ white-space:nowrap; }

  /* ---- rows-table: 見出しの折返しと、狭幅での崩れ対策 ---- */
  table.rows-table thead th{ white-space:normal; overflow-wrap:anywhere; }
  @media (max-width:1079px){
    table.rows-table{ table-layout:auto; min-width:max-content; }
  }

  /* ---- tabs ---- */
  .tabbar{ position:sticky; top:0; z-index:20; background:var(--surface); border-bottom:1px solid var(--line); }
  .tabbar-inner{ max-width:1120px; margin:0 auto; padding:8px 20px 0; display:flex; gap:4px; overflow-x:auto; }
  .tab-btn{
    font-family:var(--font-heading); font-weight:700; font-size:0.92rem; white-space:nowrap;
    padding:10px 16px; border:none; background:transparent; color:var(--muted);
    border-radius:8px 8px 0 0; cursor:pointer;
  }
  .tab-btn:hover{ color:var(--ink); }
  .tab-btn.active{ background:var(--indigo-soft); color:var(--indigo); }

  .tabpanels{ max-width:1120px; margin:0 auto; padding:20px 20px 120px; }
  .tab-panel{ display:none; }
  .tab-panel.active{ display:block; }

  /* ---- 章ジャンプバー（重要事項説明書タブのみ） ---- */
  .jump-bar{ display:flex; flex-wrap:wrap; gap:6px; margin:0 0 18px; padding:10px; background:var(--surface); border:1px solid var(--line); border-radius:8px; }
  .jump-btn{
    font-family:var(--font-body); font-weight:700; font-size:0.74rem; white-space:nowrap;
    padding:4px 10px; border-radius:6px; border:1px solid var(--line);
    background:var(--paper); color:var(--indigo); cursor:pointer;
  }
  .jump-btn:hover{ background:var(--indigo-soft); }

  /* ---- v0.2.0案（改訂）: 見出しを左・項目を右に展開する「項目グリッド」
         4列(≥1200px) / 3列(900-1199px) / 2列(600-899px) / 1列(<600px) ---- */
  .run-grid{
    display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:10px 16px; align-items:start;
  }
  @media (max-width:1199px){ .run-grid{ grid-template-columns:repeat(3, minmax(0,1fr)); } }
  @media (max-width:899px){ .run-grid{ grid-template-columns:repeat(2, minmax(0,1fr)); } }
  @media (max-width:599px){ .run-grid{ grid-template-columns:1fr; } }
  .run-grid > .rows-block,
  .run-grid > .rows-wrap,
  .run-grid > .field-row-wide{ grid-column:1 / -1; min-width:0; }
  .run-grid > .field-row-span2{ grid-column:span 2; min-width:0; }
  @media (max-width:599px){
    .run-grid > .field-row-span2{ grid-column:1 / -1; }
  }

  /* ---- グループ行: 左に見出し(220px)・右に項目グリッド（紙の重説と同じ並び） ---- */
  .group-row{ display:flex; align-items:flex-start; gap:16px; margin:10px 0; }
  .group-label{
    flex:0 0 220px; width:220px; font-weight:700; font-size:0.88rem; line-height:1.4;
    color:var(--ink); word-break:break-word; overflow-wrap:anywhere; padding-top:6px;
  }
  /* 全幅で残る .heading-2/.heading-3（項目を直接持たない見出し）と文字サイズ・太さ・色を揃える */
  .group-label-2{ font-size:1rem; font-weight:700; color:var(--ink); }
  .group-label-3{ font-size:0.92rem; font-weight:700; color:var(--ink); }
  .group-row > .run-grid{ flex:1 1 auto; min-width:0; }
  /* 見出しをchecklistの前に単独表示した後や、checklistで分割された2つ目以降の
     segmentで使う「空の左見出し列」。役割・スクリーンリーダーには一切出さない。 */
  .group-label-spacer{ flex:0 0 220px; width:220px; }
  @media (max-width:599px){
    .group-row{ flex-direction:column; gap:4px; margin:8px 0; }
    .group-label{ width:100%; flex-basis:auto; padding-top:0; }
    .group-label-spacer{ display:none; }
  }

  /* ---- headings ---- */
  .heading{ font-family:var(--font-heading); }
  .heading-1{
    display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
    background:var(--indigo-soft); border-left:5px solid var(--indigo);
    padding:8px 14px; border-radius:0 6px 6px 0; margin:20px 0 10px;
  }
  .tab-panel > .heading-1:first-child{ margin-top:4px; }
  .jump-bar + .heading-1{ margin-top:4px; }
  .heading-1 .h1-badge{
    display:inline-block; background:var(--indigo); color:#fff; font-weight:700;
    font-size:0.75rem; letter-spacing:0.04em; padding:3px 9px; border-radius:4px;
    font-variant-numeric:tabular-nums;
  }
  .heading-1 .h1-title{ font-weight:700; font-size:1.1rem; color:var(--ink); }
  /* heading-2/3 は「直下に項目を持たない、細い区切り見出し」にのみ使う */
  .heading-2{
    font-weight:700; font-size:1rem; color:var(--ink); margin:14px 0 6px;
    padding-bottom:4px; border-bottom:2px solid var(--line);
  }
  .heading-3{
    font-weight:700; font-size:0.92rem; color:var(--ink); margin:10px 0 4px;
    padding-left:10px; border-left:3px solid var(--line);
  }

  /* ---- field rows（ラベルを欄の上に置いた小ブロック。横方向の並びは run-grid が担当） ---- */
  .field-row{
    display:flex; flex-direction:column; gap:4px; min-width:0;
  }
  .field-label{ font-weight:700; font-size:0.78rem; line-height:18px; word-break:break-word; overflow-wrap:anywhere; }
  .field-input{ display:flex; align-items:center; flex-wrap:wrap; gap:8px; width:100%; }
  .field-input > .input{ flex:1 1 0%; min-width:0; }
  .field-input > input.input, .field-input > select.input{ height:34px; }
  .unit{ color:var(--muted); font-size:0.85rem; white-space:nowrap; flex:0 0 auto; }
  .unit-th{ color:var(--muted); font-weight:400; }
  .note-inline{ color:var(--muted); font-size:0.78rem; }
  .field-note{ margin:0; color:var(--muted); font-size:0.78rem; line-height:1.5; word-break:break-word; overflow-wrap:anywhere; }

  /* ---- チェックリスト（全幅ブロック。グループ行の左見出しには入れない） ---- */
  .checklist-block{ grid-column:1 / -1; margin:10px 0 4px; padding:10px 0 2px; border-top:1px solid var(--line); }
  .checklist-label{ font-weight:700; font-size:0.92rem; color:var(--ink); margin-bottom:4px; }
  .check-grid{
    display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:6px 16px; margin-top:8px;
  }
  @media (max-width:1199px){ .check-grid{ grid-template-columns:repeat(3, minmax(0,1fr)); } }
  @media (max-width:899px){ .check-grid{ grid-template-columns:repeat(2, minmax(0,1fr)); } }
  @media (max-width:599px){ .check-grid{ grid-template-columns:1fr; } }
  .check-item{
    display:flex; align-items:flex-start; gap:6px; font-size:0.84rem; line-height:1.4;
    min-width:0; word-break:break-word; overflow-wrap:anywhere; cursor:pointer;
  }
  .check-item input{ flex:0 0 auto; width:16px; height:16px; margin-top:2px; }

  /* ---- inputs ---- */
  .input{
    font-family:var(--font-body); font-size:0.95rem; padding:8px 10px;
    border:1px solid var(--line); border-radius:6px; background:var(--surface);
    color:var(--ink); min-width:160px;
  }
  input.input, select.input{ height:38px; }
  select.input{ min-width:170px; }
  textarea.input{
    width:100%; min-height:64px; line-height:1.6; resize:vertical;
  }
  input.input-money, input.input-number{
    text-align:right; font-variant-numeric:tabular-nums;
  }
  .input[readonly]{ background:var(--indigo-soft); color:var(--ink); }
  .input-checkbox{ width:18px; height:18px; }
  table.rows-table td .input{ width:100%; min-width:88px; }
  td.fixed-type-cell{ font-weight:700; background:var(--paper); white-space:nowrap; }

  /* ---- action bar ---- */
  .actionbar{ position:sticky; bottom:0; z-index:20; background:var(--surface); border-top:1px solid var(--line); }
  .actionbar-inner{ max-width:1120px; margin:0 auto; padding:14px 20px; display:flex; gap:12px; justify-content:flex-end; }

  /* ---- modal ---- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(31,42,36,0.45);
    display:flex; align-items:center; justify-content:center; padding:20px; z-index:200;
  }
  .modal-box{
    background:var(--surface); border-radius:10px; padding:24px; width:100%;
    max-width:480px; box-shadow:0 12px 36px rgba(0,0,0,0.22);
    max-height:88vh; overflow-y:auto;
  }
  .modal-box-wide{ max-width:720px; }
  .modal-title{ font-family:var(--font-heading); font-weight:700; font-size:1.1rem; margin:0 0 12px; }
  .modal-message{ font-size:0.92rem; line-height:1.7; margin:0 0 16px; }
  .modal-actions{ display:flex; gap:10px; justify-content:flex-end; margin-top:18px; }
  .backup-textarea{ width:100%; max-width:100%; font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:0.76rem; white-space:pre; min-height:280px; }
  .import-section{ margin-bottom:18px; }
  .import-label{ display:block; font-weight:700; margin-bottom:6px; font-size:0.88rem; }
  #import-file-input{ font-size:0.85rem; }

  /* ---- toast ---- */
  .toast{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(14px);
    background:var(--ink); color:#fff; padding:12px 22px; border-radius:8px;
    font-size:0.9rem; opacity:0; pointer-events:none; z-index:300; max-width:90vw;
    box-shadow:0 8px 20px rgba(0,0,0,0.25);
    transition:opacity .2s ease, transform .2s ease;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto; }
  .toast-ok{ background:var(--ok); }
  .toast-error{ background:var(--seal); }

  :focus-visible{ outline:2px solid var(--indigo); outline-offset:2px; }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration:0.001ms !important; animation-iteration-count:1 !important;
      transition-duration:0.001ms !important;
    }
  }

  /* ---- 重要事項調査報告書（印刷ビュー） v0.4.0 ---- */
  .report-actions{ display:flex; gap:10px; flex-wrap:wrap; margin:0 0 18px; }

  #report-view{ display:none; }
  body.printing #report-view{ display:block; }

  .report-doc{ max-width:720px; margin:0 auto; color:var(--ink); }
  .report-header{ text-align:center; margin:0 0 20px; }
  .report-title{ font-weight:700; font-size:1.2rem; margin:0 0 8px; }
  .report-meta{ font-size:0.85rem; margin:2px 0; }

  .report-h1{
    font-weight:700; font-size:1.05rem; margin:22px 0 10px; padding-bottom:4px;
    border-bottom:0.6pt solid var(--ink); break-inside:avoid;
  }
  .report-h2{ font-weight:700; font-size:0.95rem; margin:14px 0 6px; break-inside:avoid; }
  .report-h3{
    font-weight:700; font-size:0.86rem; margin:10px 0 4px;
    padding-left:8px; border-left:2px solid var(--ink); break-inside:avoid;
  }

  .report-field-row{
    display:flex; gap:10px; padding:5px 0; border-bottom:0.6pt solid var(--ink);
    font-size:0.86rem; break-inside:avoid;
  }
  .report-label{ flex:0 0 42%; font-weight:700; }
  .report-value{ flex:1 1 auto; word-break:break-word; overflow-wrap:anywhere; }
  .report-value-text{ white-space:pre-wrap; }
  .report-blank-line{ display:inline-block; width:100%; min-height:1em; }

  .report-table{ width:100%; border-collapse:collapse; margin:6px 0 14px; font-size:0.82rem; break-inside:avoid; }
  .report-table th, .report-table td{ border:0.6pt solid var(--ink); padding:5px 8px; text-align:left; vertical-align:top; word-break:break-word; overflow-wrap:anywhere; }
  .report-table thead th{ font-weight:700; }
  .report-fixed-type-cell{ font-weight:700; white-space:nowrap; }

  .report-checklist{ margin:8px 0; break-inside:avoid; }
  .report-checklist-label{ font-weight:700; font-size:0.9rem; margin-bottom:4px; }
  .report-checklist-grid{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:4px 16px; font-size:0.84rem; }

  .report-footer{ margin-top:24px; break-inside:avoid; }
  .report-footer-title{ font-weight:700; font-size:0.92rem; margin-bottom:6px; }

  .report-requester{ margin-top:10px; text-align:left; break-inside:avoid; }
  .report-requester-title{ font-weight:700; font-size:0.92rem; margin-bottom:4px; }

  @media print{
    body.printing > *:not(#report-view){ display:none !important; }
    #report-view{ display:block; }
    @page { size: A4 portrait; margin: 14mm 12mm; }
  }

  /* ---- 重要事項説明書（FRK標準書式） v0.5.0 ---- */
  .jp-page{ width:595pt; height:842pt; position:relative; overflow:hidden; background:#fff; color:#000;
    page-break-after:always; break-inside:avoid;
    font-family:"MS Gothic","BIZ UDPGothic","Hiragino Kaku Gothic ProN",sans-serif; }
  .jp-page:last-child{ page-break-after:auto; }
  .jp-page svg{ position:absolute; left:0; top:0; width:595pt; height:842pt; }
  .jp-t{ position:absolute; white-space:nowrap; line-height:1; color:#000; transform-origin:left top; }
  .jp-overflow-list{ max-height:55vh; overflow:auto; padding-left:1.5em; }
  .jp-print-guide{ padding:12px; color:#000; background:#fff; }
  @media print{
    .jp-print-guide{ display:none; }
    .jp-page{ print-color-adjust:exact; -webkit-print-color-adjust:exact; }
    body.printing-juusetsu{ margin:0; padding:0; background:#fff; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <span class="brand-name">不動産取引システム</span>
    <span class="brand-version num">v0.5.1</span>
  </div>
</header>
<main id="app"></main>
<div id="report-view" aria-hidden="true"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="modal-root"></div>

<script>
"use strict";

/* =========================================================================
 * SCHEMA — docs/02_項目定義_schema_v0.5.json をそのまま埋め込み。
 * 項目名・順番・型・単位・選択肢・showif・computed・note・checklist はこの定数が唯一の正。
 * ========================================================================= */
const SCHEMA ={
 "version": "0.5.0",
 "based_on": "FRK標準書式 一般仲介用・区分所有建物（敷地権型）＜重.No.3＞ 全25p ＋ 追加資料5点",
 "db": {
  "name": "fudosan_torihiki_db",
  "version": 2
 },
 "tabs": [
  {
   "key": "contract",
   "label": "売買契約書"
  },
  {
   "key": "confirm",
   "label": "確認内容"
  },
  {
   "key": "settlement",
   "label": "決済"
  },
  {
   "key": "assessment",
   "label": "評価証明書"
  },
  {
   "key": "brokerage",
   "label": "仲介手数料"
  },
  {
   "key": "registry",
   "label": "登記情報"
  },
  {
   "key": "special",
   "label": "特約事項"
  },
  {
   "key": "check",
   "label": "チェック依頼"
  },
  {
   "key": "juusetsu",
   "label": "重要事項説明書"
  }
 ],
 "tables": [
  {
   "key": "deals",
   "label": "取引",
   "kind": "main"
  },
  {
   "key": "consulting_fees",
   "label": "コンサル料",
   "kind": "rows",
   "parent": "deals"
  },

対","x":37.8,"y":514.32,"w":507.6,"size":10.8,"font":"gothic","role":"label"},{"text":"　　　し、第５項の違約金に加え、売買代金の８０％相当額の違約罰を制裁金として支払います。ただし、","x":37.8,"y":525.32,"w":518.4,"size":10.8,"font":"gothic","role":"label"},{"text":"　　　宅地建物取引業者が自ら売主となり、かつ宅地建物取引業者でない者が買主となる場合は、本項は","x":37.8,"y":536.32,"w":507.6,"size":10.8,"font":"gothic","role":"label"},{"text":"　　　適用しません。","x":37.8,"y":547.32,"w":108.0,"size":10.8,"font":"gothic","role":"label"},{"text":"　以下余白","x":37.8,"y":569.32,"w":54.0,"size":10.8,"font":"gothic","role":"label"}],"slots":[],"condition":{"key":"antisocial_clause","when":"有","note":"別紙。antisocial_clause=有 のときだけ出力する"}}],"unbound_slots":[{"page":1,"id":"p1-cb5","kind":"checkbox","x":426.96,"y":159.4,"label_hint":"売買"},{"page":1,"id":"p1-cb6","kind":"checkbox","x":465.0,"y":159.4,"label_hint":"交換"},{"page":1,"id":"p1-cb7","kind":"checkbox","x":408.06,"y":178.66,"label_hint":"媒介"},{"page":1,"id":"p1-cb8","kind":"checkbox","x":446.0,"y":178.66,"label_hint":"代理"},{"page":1,"id":"p1-cb9","kind":"checkbox","x":483.95,"y":178.66,"label_hint":"売主"},{"page":3,"id":"p3-t28","kind":"text","x":52.02,"y":585.28,"w":18.0,"size":9.0,"reason":"スキーマに対応キーなし"},{"page":4,"id":"p4-t3","kind":"text","x":522.0,"y":214.46,"w":7.92,"size":7.92,"reason":"スキーマに対応キーなし"},{"page":4,"id":"p4-t4","kind":"text","x":63.0,"y":381.86,"w":7.92,"size":7.92,"reason":"スキーマに対応キーなし"},{"page":5,"id":"p5-t10","kind":"text","x":210.6,"y":539.75,"w":119.52,"size":9.9,"reason":"スキーマに対応キーなし"},{"page":10,"id":"p10-t17-0","kind":"text","x":50.04,"y":258.45,"w":495.0,"size":9.0,"reason":"スキーマに対応キーなし"},{"page":10,"id":"p10-t17-1","kind":"text","x":50.04,"y":271.95,"w":495.0,"size":9.0,"reason":"スキーマに対応キーなし"},{"page":10,"id":"p10-t26-0","kind":"text","x":469.62,"y":686.62,"w":31.5,"size":9.0,"reason":"スキーマに対応キーなし"},{"page":10,"id":"p10-t26-1","kind":"text","x":469.62,"y":699.93,"w":31.5,"size":9.0,"reason":"スキーマに対応キーなし"}]};

  if (t.kind === "fixed_rows") FIXED_ORDER_BY_TABLE[t.key] = t.fixed;
  if (t.max_rows) MAX_ROWS_BY_TABLE[t.key] = t.max_rows;
  if (t.note) TABLE_NOTE_BY_TABLE[t.key] = t.note;
});
// 固定行テーブルの先頭列見出し（schemaにはUI文言までは定義されていないため、
// 内容に即した表現を1テーブルずつ割り当てる。他に固定行テーブルが増えた場合は「種別」を既定とする）。
const FIXED_HEADER_LABEL = { exclusive_restrictions: "制限種別", exclusive_use_rights: "対象" };

const FIELDS_BY_TAB = {};
SCHEMA.tabs.forEach(t => { FIELDS_BY_TAB[t.key] = []; });
SCHEMA.layout.forEach(item => { FIELDS_BY_TAB[item.tab].push(item); });

const DEAL_FIELD_DEFS = {};
SCHEMA.layout.forEach(item => {
  if (item.kind === "field" && item.table === "deals") DEAL_FIELD_DEFS[item.key] = item;
});

const CHECKLIST_DEFS = {};
SCHEMA.layout.forEach(item => {
  if (item.kind === "checklist") CHECKLIST_DEFS[item.key] = item;
});

/* ---- computed: 「a + b」「a * b / c」「a * b / 100」形式のみを想定した
   簡易な左から右への式評価器（Function/evalは使わない）。 ---- */
function tokenizeFormula(f) {
  return f.match(/[A-Za-z_][A-Za-z0-9_]*|\d+(?:\.\d+)?|[+\-*/]/g) || [];
}
function isVarToken(t) { return /^[A-Za-z_]/.test(t); }
const COMPUTED_DEFS = Object.values(DEAL_FIELD_DEFS)
  .filter(d => !!d.computed)
  .map(d => ({ key: d.key, formula: d.computed, tokens: tokenizeFormula(d.computed) }));

function evalComputedTokens(tokens, deal) {
  const varTokens = tokens.filter(isVarToken);
  const allEmpty = varTokens.length > 0 && varTokens.every(k => {
    const v = deal[k];
    return v === null || v === undefined || v === "";
  });
  if (allEmpty) return null;
  const val = (t) => {
    if (isVarToken(t)) {
      const v = deal[t];
      return (v === null || v === undefined || v === "") ? 0 : Number(v);
    }
    return Number(t);
  };
  let result = val(tokens[0]);
  for (let i = 1; i + 1 < tokens.length; i += 2) {
    const op = tokens[i];
    const rhs = val(tokens[i + 1]);
    if (op === "+") result += rhs;
    else if (op === "-") result -= rhs;
    else if (op === "*") result *= rhs;
    else if (op === "/") {
      if (rhs === 0) return null;
      result = result / rhs;
    }
  }
  return isFinite(result) ? result : null;
}
/** すべての computed 項目を、依存関係の連鎖が収束するまで最大5回再計算する。 */
function recomputeAllComputed(deal) {
  for (let pass = 0; pass < 5; pass++) {
    let changed = false;
    COMPUTED_DEFS.forEach(def => {
      const nv = evalComputedTokens(def.tokens, deal);
      const ov = (deal[def.key] === undefined) ? null : deal[def.key];
      if (nv !== ov) { deal[def.key] = nv; changed = true; }
    });
    if (!changed) break;
  }
}

/* ---- showif: 条件表示。判定は常に「現在の値」に対して行い、非表示中も値は保持する。 ---- */
const SHOWIF_BY_DRIVER = {};
Object.values(DEAL_FIELD_DEFS).forEach(def => {
  if (def.showif) {
    const dk = def.showif.key;
    (SHOWIF_BY_DRIVER[dk] = SHOWIF_BY_DRIVER[dk] || []).push(def.key);
  }
});
function isShowifVisible(def, _visited) {
  if (!def.showif) return true;
  const visited = _visited || new Set();
  if (visited.has(def.key)) return true; // 循環参照ガード
  visited.add(def.key);
  // driver自身がshowifを持ち、その結果driverが非表示なら、この項目も非表示にする（推移的判定）。
  const driverDef = DEAL_FIELD_DEFS[def.showif.key];
  if (driverDef && driverDef.showif && !isShowifVisible(driverDef, visited)) {
    return false;
  }
  const v = state.deal[def.showif.key];
  return def.showif.in.indexOf(v) !== -1;
}
function applyShowifForKeyDom(key) {
  const def = DEAL_FIELD_DEFS[key];
  if (!def || !def.showif) return;
  const row = document.getElementById("fr_" + key);
  if (row) row.hidden = !isShowifVisible(def);
}
/** driverKey の値が変わったときに呼ぶ。依存する項目を辿って再表示判定し、連鎖にも対応する。 */
function applyShowifCascade(driverKey) {
  const queue = (SHOWIF_BY_DRIVER[driverKey] || []).slice();
  const seen = new Set();
  while (queue.length) {
    const depKey = queue.shift();
    applyShowifForKeyDom(depKey);
    if (!seen.has(depKey)) {
      seen.add(depKey);
      (SHOWIF_BY_DRIVER[depKey] || []).forEach(k => queue.push(k));
    }
  }
}
/** 画面構築直後に、すべての showif 項目の表示状態を現在値で揃え直す。 */
function applyAllShowifs() {
  Object.values(DEAL_FIELD_DEFS).forEach(def => {
    if (def.showif) applyShowifForKeyDom(def.key);
  });
}

/* =========================================================================
 * アプリ状態
 * ========================================================================= */
const state = {
  view: "list",        // 'list' | 'edit'
  activeTab: "contract",
  deal: null,
  rows: {},             // { table: [ {..., _uid, row_no} ] }  table は ROW_TABLES の各キー
  fixed: {},            // { table: [ {..., _uid, restriction_type} ] }  table は FIXED_TABLES の各キー
  dirty: false,
  rowUidCounter: 1,
};
let db = null;
let pendingModalAction = null;
let toastTimer = null;

/* =========================================================================
 * ユーティリティ
 * ========================================================================= */
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, ch => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[ch]));
}

function formatMoney(n) {
  if (n === null || n === undefined || n === "" || isNaN(n)) return "";
  return Number(n).toLocaleString("ja-JP");
}

function formatDateTime(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  if (isNaN(d.getTime())) return String(iso);
  const p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
}

function defaultForType(type) {
  if (type === "money" || type === "number" || type === "percent") return null;
  if (type === "checkbox") return false;
  return "";
}

function autosize(el) {
  el.style.height = "auto";
  el.style.height = el.scrollHeight + "px";
}

/* =========================================================================
 * データ正規化（DB から読んだ／新規作成した値を型どおりに整える）
 * ========================================================================= */
function normalizeDealRecord(rec) {
  rec = rec || {};
  const d = {
    id: (rec.id !== undefined && rec.id !== null) ? rec.id : null,
    created_at: rec.created_at || null,
    updated_at: rec.updated_at || null,
  };
  Object.values(DEAL_FIELD_DEFS).forEach(def => {
    let v = rec[def.key];
    if (def.type === "money" || def.type === "number" || def.type === "percent") {
      if (v === undefined || v === null || v === "") v = null;
      else if (typeof v === "string") { const n = parseFloat(v.replace(/,/g, "")); v = isNaN(n) ? null : n; }
      else if (typeof v !== "number") v = null;
    } else if (def.type === "checkbox") {
      v = !!v;
    } else {
      v = (v === undefined || v === null) ? "" : v;
    }
    d[def.key] = v;
  });
  Object.keys(CHECKLIST_DEFS).forEach(key => {
    const v = rec[key];
    d[key] = Array.isArray(v) ? v.filter(x => typeof x === "string") : [];
  });
  recomputeAllComputed(d);
  return d;
}

function ensureRowDefaults(table, row) {
  const defs = SCHEMA.row_fields[table];
  const r = { ...row };
  defs.forEach(def => {
    let v = r[def.key];
    if (def.type === "money" || def.type === "number" || def.type === "percent") {
      if (v === undefined || v === null || v === "") v = null;
      else if (typeof v === "string") { const n = parseFloat(v.replace(/,/g, "")); v = isNaN(n) ? null : n; }
      else if (typeof v !== "number") v = null;
    } else if (def.type === "checkbox") {
      v = !!v;
    } else {
      v = (v === undefined || v === null) ? "" : v;
    }
    r[def.key] = v;
  });
  return r;
}

function blankDeal() {
  return normalizeDealRecord({});
}

function blankRow(table, rowNo) {
  const r = ensureRowDefaults(table, {});
  r.id = null;
  r.row_no = rowNo;
  r._uid = state.rowUidCounter++;
  return r;
}

function blankFixedSet(table) {
  const order = FIXED_ORDER_BY_TABLE[table];
  return order.map(type => {
    const r = ensureRowDefaults(table, {});
    r.id = null;
    r.restriction_type = type;
    r._uid = state.rowUidCounter++;
    return r;
  });
}

function newDeal() {
  state.deal = blankDeal();
  state.rows = {};
  ROW_TABLES.forEach(t => { state.rows[t] = [blankRow(t, 1)]; });
  state.fixed = {};
  FIXED_TABLES.forEach(t => { state.fixed[t] = blankFixedSet(t); });
  state.dirty = false;
  state.activeTab = "contract";
}

async function loadDeal(id) {
  const rec = await idbGet("deals", id);
  state.deal = normalizeDealRecord(rec || { id });
  state.rows = {};
  for (const table of ROW_TABLES) {
    const all = await idbGetAllByIndex(table, "deal_id", id);
    all.sort((a, b) => (a.row_no ?? 0) - (b.row_no ?? 0));
    state.rows[table] = all.map(r => {
      const nr = ensureRowDefaults(table, r);
      nr.id = r.id;
      nr.row_no = r.row_no ?? 0;
      nr._uid = state.rowUidCounter++;
      return nr;
    });
  }
  state.fixed = {};
  for (const table of FIXED_TABLES) {
    const order = FIXED_ORDER_BY_TABLE[table];
    const all = await idbGetAllByIndex(table, "deal_id", id);
    state.fixed[table] = order.map(type => {
      const found = all.find(r => r.restriction_type === type) || {};
      const nr = ensureRowDefaults(table, found);
      nr.id = (found.id !== undefined) ? found.id : null;
      nr.restriction_type = type;
      nr._uid = state.rowUidCounter++;
      return nr;
    });
  }
  state.dirty = false;
  state.activeTab = "contract";
}

/* =========================================================================
 * IndexedDB
 * v1(v0.2.0までの6ストア) → v2 で9ストア追加。既存ストアは削除・再作成しない。
 * ========================================================================= */
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(SCHEMA.db.name, SCHEMA.db.version);
    req.onupgradeneeded = (e) => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains("deals")) {
        d.createObjectStore("deals", { keyPath: "id", autoIncrement: true });
      }
      [...ROW_TABLES, ...FIXED_TABLES].forEach(name => {
        if (!d.objectStoreNames.contains(name)) {
          const s = d.createObjectStore(name, { keyPath: "id", autoIncrement: true });
          s.createIndex("deal_id", "deal_id", { unique: false });
        }
      });
    };
    req.onsuccess = (e) => { db = e.target.result; resolve(db); };
    req.onerror = (e) => { reject(e.target.error); };
  });
}

function idbGetAll(table) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction([table], "readonly");
    const req = tx.objectStore(table).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}
function idbGet(table, id) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction([table], "readonly");
    const req = tx.objectStore(table).get(id);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}
function idbGetAllByIndex(table, indexName, value) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction([table], "readonly");
    const idx = tx.objectStore(table).index(indexName);
    const req = idx.getAll(IDBKeyRange.only(value));
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}

/* =========================================================================
 * 描画: 一覧画面
 * ========================================================================= */
function showListView() {
  state.view = "list";
  renderList();
}

async function renderList() {
  const app = document.getElementById("app");
  let deals = [];
  try { deals = await idbGetAll("deals"); }
  catch (err) {
    app.innerHTML = '<div class="container"><p class="empty-msg">一覧の取得に失敗しました: ' + escapeHtml(err && err.message || String(err)) + '</p></div>';
    return;
  }
  deals.sort((a, b) => String(b.updated_at || "").localeCompare(String(a.updated_at || "")));

  const toolbarHtml =
    '<div class="toolbar">' +
    '<button type="button" class="btn btn-primary" data-action="new-deal">新規作成</button>' +
    '<button type="button" class="btn" data-action="export-backup">バックアップを書き出す</button>' +
    '<button type="button" class="btn" data-action="import-backup-open">バックアップを読み込む</button>' +
    '</div>';

  if (deals.length === 0) {
    app.innerHTML = '<div class="container">' + toolbarHtml +

  const rowsHtml = deals.map(d => {

    return '<tr class="list-row" tabindex="0" data-action="open-deal" data-id="' + d.id + '">' +
      '<td class="num">' + d.id + '</td>' +
      '<td class="num">' + dateDisp + '</td>' +
      '<td class="num">' + escapeHtml(priceDisp) + '</td>' +
      '<td class="col-action"><button type="button" class="btn btn-danger btn-sm" data-action="delete-deal" data-id="' + d.id + '">削除</button></td>' +
      '</tr>';

  app.innerHTML = '<div class="container">' + toolbarHtml +

    '<thead><tr><th>id</th><th>売買契約日</th><th>売買価格</th><th class="col-action"></th></tr></thead>' +
    '<tbody>' + rowsHtml + '</tbody></table></div></div>';
}

/* =========================================================================
 * 描画: 入力画面
 * ========================================================================= */
function bindAttrs(bind) {
  let a = ' data-scope="' + bind.scope + '" data-key="' + bind.key + '"';
  if (bind.table) a += ' data-table="' + bind.table + '"';
  if (bind.uid !== undefined) a += ' data-uid="' + bind.uid + '"';
  if (bind.ariaLabel) a += ' aria-label="' + escapeHtml(bind.ariaLabel) + '"';
  return a;
}

function renderInputForType(def, value, bind) {
  const attrs = bindAttrs(bind) + ' data-type="' + def.type + '"';
  const idAttr = (bind.scope === "deal") ? (' id="f_' + def.key + '"') : "";
  switch (def.type) {
    case "text":
      return '<input type="text" class="input"' + idAttr + attrs + ' value="' + escapeHtml(value ?? "") + '">';
    case "textarea":
      return '<textarea class="input textarea"' + idAttr + attrs + ' rows="2">' + escapeHtml(value ?? "") + '</textarea>';
    case "money": {
      const disp = (value === null || value === undefined) ? "" : formatMoney(value);
      const roAttr = def.readonly ? " readonly" : "";
      return '<input type="text" inputmode="numeric" class="input input-money"' + idAttr + attrs + ' value="' + escapeHtml(disp) + '"' + roAttr + '>';
    }
    case "number":
    case "percent": {
      const roAttr = def.readonly ? " readonly" : "";
      return '<input type="number" step="any" class="input input-number"' + idAttr + attrs + ' value="' + ((value === null || value === undefined) ? "" : value) + '"' + roAttr + '>';
    }
    case "date":
      return '<input type="date" class="input"' + idAttr + attrs + ' value="' + escapeHtml(value || "") + '">';
    case "time":
      return '<input type="time" class="input"' + idAttr + attrs + ' value="' + escapeHtml(value || "") + '">';
    case "yearmonth":
      return '<input type="month" class="input"' + idAttr + attrs + ' value="' + escapeHtml(value || "") + '">';
    case "yesno": {
      const opts = ["", "あり", "なし"];
      const hasLegacy = value !== null && value !== undefined && value !== "" && opts.indexOf(value) === -1;
      const legacyHtml = hasLegacy ? ('<option value="' + escapeHtml(value) + '" selected>（旧データ）' + escapeHtml(value) + '</option>') : "";
      const optsHtml = '<option value=""' + (value === "" ? " selected" : "") + '></option>' + legacyHtml +
        ["あり", "なし"].map(o => '<option value="' + escapeHtml(o) + '"' + (value === o ? " selected" : "") + '>' + escapeHtml(o) + '</option>').join("");
      return '<select class="input"' + idAttr + attrs + '>' + optsHtml + '</select>';
    }
    case "select": {
      const options = def.options || [];
      const hasLegacy = value !== null && value !== undefined && value !== "" && options.indexOf(value) === -1;
      const legacyHtml = hasLegacy ? ('<option value="' + escapeHtml(value) + '" selected>（旧データ）' + escapeHtml(value) + '</option>') : "";
      const optsHtml = '<option value=""' + (!value ? " selected" : "") + '></option>' + legacyHtml +
        options.map(o => '<option value="' + escapeHtml(o) + '"' + (value === o ? " selected" : "") + '>' + escapeHtml(o) + '</option>').join("");
      return '<select class="input"' + idAttr + attrs + '>' + optsHtml + '</select>';
    }
    case "checkbox":
      return '<input type="checkbox" class="input-checkbox"' + idAttr + attrs + (value ? " checked" : "") + '>';
    default:
      return '<input type="text" class="input"' + idAttr + attrs + ' value="' + escapeHtml(value ?? "") + '">';
  }
}

/** 見出し文字列を「先頭の記号部分（全角スペースまで）」と「残り」に分ける。
    区切りの全角スペースが無い見出し（例:「II-7〜9」）は全体を記号部分として扱う。 */
function splitHeadingBadge(text) {
  const idx = text.indexOf("　");
  if (idx === -1) return { badge: text, sep: "", rest: "" };
  return { badge: text.slice(0, idx), sep: "　", rest: text.slice(idx + 1) };
}

function renderHeading(item, idAttr) {
  idAttr = idAttr || "";
  if (item.level === 1) {
    const parts = splitHeadingBadge(item.text);
    if (parts.sep) {
      return '<div class="heading heading-1"' + idAttr + ' role="heading" aria-level="1"><span class="h1-badge">' + escapeHtml(parts.badge) + '</span>' + escapeHtml(parts.sep) + '<span class="h1-title">' + escapeHtml(parts.rest) + '</span></div>';
    }
    return '<div class="heading heading-1"' + idAttr + ' role="heading" aria-level="1"><span class="h1-badge">' + escapeHtml(parts.badge) + '</span></div>';
  }
  if (item.level === 2) return '<div class="heading heading-2"' + idAttr + ' role="heading" aria-level="2">' + escapeHtml(item.text) + '</div>';
  return '<div class="heading heading-3"' + idAttr + ' role="heading" aria-level="3">' + escapeHtml(item.text) + '</div>';
}

function renderFieldRow(def, spanMode) {
  const value = state.deal[def.key];
  const inputHtml = renderInputForType(def, value, { scope: "deal", key: def.key });
  const unitHtml = def.unit ? ('<span class="unit">' + escapeHtml(def.unit) + '</span>') : "";
  const noteHtml = def.note ? ('<p class="field-note">' + escapeHtml(def.note) + '</p>') : "";
  let cls = "field-row";
  if (spanMode === "wide") cls += " field-row-wide";
  else if (spanMode === "span2") cls += " field-row-span2";
  let hiddenAttr = "";
  if (def.showif && !isShowifVisible(def)) hiddenAttr = " hidden";
  return '<div class="' + cls + '" id="fr_' + def.key + '"' + hiddenAttr + '><label class="field-label" for="f_' + def.key + '">' + escapeHtml(def.label) + '</label>' +
    '<div class="field-input">' + inputHtml + unitHtml + '</div>' + noteHtml + '</div>';
}

/** checklist: 見出し＋チェックボックスのグリッドを「全幅ブロック」として描画する
    （グループ行の左見出し列には入れない）。保存形式はチェック済みラベル文字列の配列。 */
function renderChecklistBlock(item) {
  const values = Array.isArray(state.deal[item.key]) ? state.deal[item.key] : [];
  const itemsHtml = item.items.map((label, idx) => {
    const checked = values.indexOf(label) !== -1;
    return '<label class="check-item"><input type="checkbox" data-scope="checklist" data-key="' + item.key + '" data-idx="' + idx + '"' + (checked ? " checked" : "") + '> ' + escapeHtml(label) + '</label>';
  }).join("");
  const noteHtml = item.note ? ('<p class="field-note">' + escapeHtml(item.note) + '</p>') : "";
  return '<div class="checklist-block" id="fr_' + item.key + '">' +
    '<div class="checklist-label" role="heading" aria-level="3">' + escapeHtml(item.label) + '</div>' +
    noteHtml +
    '<div class="check-grid">' + itemsHtml + '</div>' +
    '</div>';
}

function renderRowsSection(table) {
  const defs = SCHEMA.row_fields[table];
  const rows = state.rows[table] || [];
  const tableLabel = TABLE_LABELS[table] || table;
  const maxRows = MAX_ROWS_BY_TABLE[table];
  const atMax = !!maxRows && rows.length >= maxRows;
  const theadHtml = '<tr>' + defs.map(d => '<th>' + escapeHtml(d.label) + (d.unit ? (' <span class="unit-th">(' + escapeHtml(d.unit) + ')</span>') : '') + '</th>').join("") +
    '<th class="col-action"></th></tr>';
  const bodyHtml = rows.map((row, rowIdx) => {
    const cells = defs.map(d => '<td>' + renderInputForType(d, row[d.key], {
      scope: "row", table: table, uid: row._uid, key: d.key,
      ariaLabel: tableLabel + " " + (rowIdx + 1) + "行目 " + d.label
    }) + '</td>').join("");
    return '<tr>' + cells + '<td class="col-action"><button type="button" class="btn btn-ghost btn-sm" data-action="remove-row" data-table="' + table + '" data-uid="' + row._uid + '">この行を消す</button></td></tr>';
  }).join("");
  const addDisabled = atMax ? " disabled" : "";
  const noteHtml = TABLE_NOTE_BY_TABLE[table] ? ('<p class="field-note">' + escapeHtml(TABLE_NOTE_BY_TABLE[table]) + '</p>') : "";
  return '<div class="rows-block" id="rowsblock-' + table + '">' +
    '<div class="rows-wrap"><table class="rows-table"><thead>' + theadHtml + '</thead><tbody>' + bodyHtml + '</tbody></table></div>' +
    '<button type="button" class="btn btn-add" data-action="add-row" data-table="' + table + '"' + addDisabled + '>＋ 行を足す</button>' +
    noteHtml +
    '</div>';
}

function renderFixedRowsSection(table) {
  const defs = SCHEMA.row_fields[table];
  const headerLabel = FIXED_HEADER_LABEL[table] || "種別";
  const theadHtml = '<tr><th>' + escapeHtml(headerLabel) + '</th>' + defs.map(d => '<th>' + escapeHtml(d.label) + (d.unit ? (' <span class="unit-th">(' + escapeHtml(d.unit) + ')</span>') : '') + '</th>').join("") + '</tr>';
  const rows = state.fixed[table] || [];
  const bodyHtml = rows.map(row => {
    const cells = '<td class="fixed-type-cell">' + escapeHtml(row.restriction_type) + '</td>' +
      defs.map(d => '<td>' + renderInputForType(d, row[d.key], {
        scope: "fixed", table: table, uid: row._uid, key: d.key,
        ariaLabel: row.restriction_type + " " + d.label
      }) + '</td>').join("");
    return '<tr>' + cells + '</tr>';
  }).join("");
  return '<div class="rows-wrap"><table class="rows-table"><thead>' + theadHtml + '</thead><tbody>' + bodyHtml + '</tbody></table></div>';
}

/* ---- v0.2.0案（改訂）: 見出しを左、項目を右に横展開するグルーピング描画 ---- */
function isTextareaOnlyRun(run) {
  return run.length > 0 && run.every(it => it.kind === "field" && it.type === "textarea");
}

function renderRunItem(item, textareaOnlyRun) {
  if (item.kind === "rows") return renderRowsSection(item.table);
  if (item.kind === "fixed_rows") return renderFixedRowsSection(item.table);
  if (item.type === "textarea") return renderFieldRow(item, textareaOnlyRun ? "wide" : "span2");
  return renderFieldRow(item, null);
}

function renderRunGrid(run, allowWide) {
  // allowWide: 「タブ内でその項目だけ」の例外(特約事項/登記情報/05)専用。
  // グループ行(見出しつき)の中では常に false にし、textareaは2列ぶんで並べる。
  const textareaOnlyRun = allowWide !== false && isTextareaOnlyRun(run);
  return '<div class="run-grid">' + run.map(it => renderRunItem(it, textareaOnlyRun)).join("") + '</div>';
}

/** checklist はグループ行(左見出し＋右グリッド)に入れず全幅ブロックとして割り込ませるため、
    runをchecklistの境目で分割してから、それぞれを個別に描画する。 */
function splitRunAtChecklists(run) {
  const segments = [];
  let buf = [];
  run.forEach(it => {
    if (it.kind === "checklist") {
      if (buf.length) { segments.push({ type: "items", items: buf }); buf = []; }
      segments.push({ type: "checklist", item: it });
    } else {
      buf.push(it);
    }
  });
  if (buf.length) segments.push({ type: "items", items: buf });
  return segments;
}

/** 見出しを直接持たないrun（タブ先頭・level1直下など）。checklistが混在すれば全幅で割り込む。 */
function renderTopLevelRun(run) {
  return splitRunAtChecklists(run).map(seg =>
    seg.type === "checklist" ? renderChecklistBlock(seg.item) : renderRunGrid(seg.items)
  ).join("");
}

function renderGroupRow(headingItem, run) {
  const lvlCls = headingItem.level === 2 ? " group-label-2" : (headingItem.level === 3 ? " group-label-3" : "");
  const segments = splitRunAtChecklists(run);
  let html = "";
  let headingShown = false;
  // runの先頭がchecklistの場合、見出しを単独の全幅見出しとして先に出す
  // （そうしないと見出しがchecklistの後ろに回ってしまうため）。
  if (segments.length && segments[0].type === "checklist") {
    html += renderHeading(headingItem);
    headingShown = true;
  }
  html += segments.map(seg => {
    if (seg.type === "checklist") return renderChecklistBlock(seg.item);
    if (!headingShown) {
      headingShown = true;
      return '<div class="group-row"><div class="group-label' + lvlCls + '" role="heading" aria-level="' + headingItem.level + '">' + escapeHtml(headingItem.text) + '</div>' + renderRunGrid(seg.items, false) + '</div>';
    }
    // 見出しは最初のセグメントで既に出したので、2つ目以降は左見出し列を空にする。
    return '<div class="group-row"><div class="group-label-spacer" aria-hidden="true"></div>' + renderRunGrid(seg.items, false) + '</div>';
  }).join("");
  return html;
}

/** 重要事項説明書タブ専用: level1見出しの先頭記号をボタンにした章ジャンプバー。 */
function buildJumpBar(entries) {
  if (!entries.length) return "";
  const btns = entries.map(e =>
    '<button type="button" class="jump-btn" data-action="jump-to" data-target="' + e.id + '">' + escapeHtml(e.badge) + '</button>'
  ).join("");
  return '<nav class="jump-bar" aria-label="章ジャンプ">' + btns + '</nav>';
}

function renderTabPanel(tabKey) {
  const items = FIELDS_BY_TAB[tabKey] || [];
  let html = "";
  let i = 0;
  const jumpEntries = [];
  let h1Counter = 0;
  while (i < items.length) {
    const item = items[i];
    if (item.kind === "heading") {
      if (item.level === 1) {
        let idAttr = "";
        if (tabKey === "juusetsu") {
          const hid = "jh-" + (h1Counter++);
          idAttr = ' id="' + hid + '"';
          jumpEntries.push({ id: hid, badge: splitHeadingBadge(item.text).badge });
        }
        html += renderHeading(item, idAttr);
        i++; continue;
      }
      // level2/level3: 直下に項目(見出し以外)を持たなければ「細い全幅見出し」のまま。
      // 持つ場合は「左に見出しラベル・右に項目グリッド」の1グループ行にする
      // （ただしchecklistが混ざっていればそこだけ全幅ブロックへ割り込む＝renderGroupRow内で処理）。
      const nextItem = items[i + 1];
      const hasContent = !!nextItem && nextItem.kind !== "heading";
      if (!hasContent) { html += renderHeading(item); i++; continue; }
      const run = [];
      let j = i + 1;
      while (j < items.length && items[j].kind !== "heading") { run.push(items[j]); j++; }
      html += renderGroupRow(item, run);
      i = j;
      continue;
    }
    // 見出しを直接持たない項目の並び（タブ先頭 or level1直下）は、そのまま項目グリッド(＋checklist全幅)のみ。
    const run = [];
    let j = i;
    while (j < items.length && items[j].kind !== "heading") { run.push(items[j]); j++; }
    html += renderTopLevelRun(run);
    i = j;
  }
  const jumpBarHtml = (tabKey === "juusetsu") ? buildJumpBar(jumpEntries) : "";
  const reportActionsHtml = (tabKey === "juusetsu") ?
    '<div class="report-actions">' +
    '<button type="button" class="btn" data-action="report-blank">調査依頼書を出す（空欄）</button>' +
    '<button type="button" class="btn" data-action="report-filled">調査報告書の控えを出す（記入済み）</button>' +
    '<button type="button" class="btn btn-primary" data-action="report-juusetsu">重要事項説明書を印刷する</button>' +
    '</div>' : "";
  return '<div class="tab-panel" id="tabpanel-' + tabKey + '" data-tab="' + tabKey + '">' + jumpBarHtml + reportActionsHtml + html + '</div>';
}

function buildEditHtml() {
  const tabsHtml = SCHEMA.tabs.map(t => '<button type="button" class="tab-btn" data-action="tab" data-tab="' + t.key + '">' + escapeHtml(t.label) + '</button>').join("");
  const panelsHtml = SCHEMA.tabs.map(t => renderTabPanel(t.key)).join("");
  return '<div class="tabbar"><div class="tabbar-inner">' + tabsHtml + '</div></div>' +
    '<div class="tabpanels">' + panelsHtml + '</div>' +
    '<div class="actionbar"><div class="actionbar-inner">' +
    '<button type="button" class="btn" data-action="back-to-list">一覧へ戻る</button>' +
    '<button type="button" class="btn btn-primary" data-action="save-deal">保存</button>' +
    '</div></div>';
}

/** 重要事項説明書タブの章ジャンプ: 対象見出しへスクロールし、sticky なタブバーの
    高さぶんだけ戻して見出しが隠れないようにする。 */
function scrollToHeading(targetId) {
  const el = document.getElementById(targetId);
  if (!el) return;
  el.scrollIntoView({ block: "start" });
  const bar = document.querySelector(".tabbar");
  const offset = (bar ? bar.getBoundingClientRect().height : 0) + 10;
  window.scrollBy(0, -offset);

/* =========================================================================
 * フィールド入力の反映
 * ========================================================================= */
function resolveTarget(scope, table, uid) {
  if (scope === "deal") return state.deal;
  if (scope === "row") return (state.rows[table] || []).find(r => String(r._uid) === String(uid));
  if (scope === "fixed") return (state.fixed[table] || []).find(r => String(r._uid) === String(uid));
  return null;
}

function parseValueForType(type, raw) {
  switch (type) {
    case "money": {
      const digits = String(raw).replace(/[^0-9]/g, "");
      if (digits === "") return null;
      const n = parseInt(digits, 10);
      return isNaN(n) ? null : n;
    }
    case "number":
    case "percent": {
      if (raw === "" || raw === null || raw === undefined) return null;
      const n = parseFloat(raw);
      return isNaN(n) ? null : n;
    }
    case "checkbox":
      return !!raw;
    default:
      return raw;
  }
}

/** チェックリスト: 保存形式は「チェック済みラベル文字列の配列」。未チェックは配列に入れない。 */
function handleChecklistInput(t) {
  const key = t.dataset.key;
  const idx = Number(t.dataset.idx);
  const def = CHECKLIST_DEFS[key];
  if (!def) return;
  const label = def.items[idx];
  let arr = Array.isArray(state.deal[key]) ? state.deal[key].slice() : [];
  const has = arr.indexOf(label) !== -1;
  if (t.checked && !has) arr.push(label);
  else if (!t.checked && has) arr = arr.filter(x => x !== label);
  state.deal[key] = arr;
  state.dirty = true;
}

function refreshComputedDisplays() {
  COMPUTED_DEFS.forEach(def => {
    const el = document.getElementById("f_" + def.key);
    if (!el) return;
    const v = state.deal[def.key];
    el.value = (v === null || v === undefined) ? "" : formatMoney(v);
  });
}

function handleFieldInput(t) {
  if (t.readOnly) return;
  const scope = t.dataset.scope;
  if (scope === "checklist") { handleChecklistInput(t); return; }
  const key = t.dataset.key;
  const type = t.dataset.type;
  const raw = (type === "checkbox") ? t.checked : t.value;
  const parsed = parseValueForType(type, raw);
  const target = resolveTarget(scope, t.dataset.table, t.dataset.uid);
  if (!target) return;
  target[key] = parsed;
  state.dirty = true;
  if (scope === "deal") {
    recomputeAllComputed(state.deal);
    refreshComputedDisplays();
    applyShowifCascade(key);
  }
}

function onMoneyFocus(el) {
  const o = resolveTarget(el.dataset.scope, el.dataset.table, el.dataset.uid);
  if (!o) return;
  const v = o[el.dataset.key];
  el.value = (v === null || v === undefined) ? "" : String(v);
}
function onMoneyBlur(el) {
  const o = resolveTarget(el.dataset.scope, el.dataset.table, el.dataset.uid);
  if (!o) return;
  const v = o[el.dataset.key];
  el.value = (v === null || v === undefined) ? "" : formatMoney(v);
}

/* =========================================================================
 * 保存・削除
 * ========================================================================= */
function performSave() {
  const isNew = (state.deal.id === null || state.deal.id === undefined);
  const now = new Date().toISOString();
  recomputeAllComputed(state.deal);
  const dealToSave = { ...state.deal };
  delete dealToSave.id;
  dealToSave.updated_at = now;
  dealToSave.created_at = isNew ? now : (state.deal.created_at || now);

  const tx = db.transaction(ALL_STORES, "readwrite");
  tx.oncomplete = () => { state.dirty = false; showToast("保存しました", "ok"); showListView(); };
  tx.onerror = () => { showToast("保存に失敗しました: " + (tx.error && tx.error.message || "不明なエラー"), "error"); };
  tx.onabort = () => { showToast("保存に失敗しました（処理が中断されました）", "error"); };

  const dealsStore = tx.objectStore("deals");
  let dealReq;
  if (isNew) {
    dealReq = dealsStore.add(dealToSave);
  } else {
    dealToSave.id = state.deal.id;
    dealReq = dealsStore.put(dealToSave);
  }

  dealReq.onsuccess = () => {
    const dealId = isNew ? dealReq.result : state.deal.id;
    state.deal.id = dealId;
    state.deal.created_at = dealToSave.created_at;
    state.deal.updated_at = dealToSave.updated_at;

    ROW_TABLES.forEach(table => {
      const store = tx.objectStore(table);
      const idx = store.index("deal_id");
      const cReq = idx.openCursor(IDBKeyRange.only(dealId));
      cReq.onsuccess = (ev) => {
        const cursor = ev.target.result;
        if (cursor) { cursor.delete(); cursor.continue(); }
        else {
          state.rows[table].forEach((row, i) => {
            const toSave = { ...row };
            delete toSave._uid; delete toSave.id;
            toSave.deal_id = dealId;
            toSave.row_no = i + 1;
            store.add(toSave);
          });
        }
      };
    });

    FIXED_TABLES.forEach(table => {
      const fstore = tx.objectStore(table);
      const fidx = fstore.index("deal_id");
      const fcReq = fidx.openCursor(IDBKeyRange.only(dealId));
      fcReq.onsuccess = (ev) => {
        const cursor = ev.target.result;
        if (cursor) { cursor.delete(); cursor.continue(); }
        else {
          state.fixed[table].forEach(row => {
            const toSave = { ...row };
            delete toSave._uid; delete toSave.id;
            toSave.deal_id = dealId;
            fstore.add(toSave);
          });
        }
      };
    });
  };
}

function actuallyDeleteDeal(id) {
  const tx = db.transaction(ALL_STORES, "readwrite");
  tx.oncomplete = () => { showToast("削除しました", "ok"); if (state.view === "list") renderList(); };
  tx.onerror = () => { showToast("削除に失敗しました", "error"); };
  tx.objectStore("deals").delete(id);
  [...ROW_TABLES, ...FIXED_TABLES].forEach(table => {
    const store = tx.objectStore(table);
    const idx = store.index("deal_id");
    const req = idx.openCursor(IDBKeyRange.only(id));
    req.onsuccess = (ev) => { const c = ev.target.result; if (c) { c.delete(); c.continue(); } };
  });
}

/* =========================================================================
 * バックアップ（書き出し・読み込み）
 * ========================================================================= */
async function gatherBackupData() {
  const data = { app: "fudosan_torihiki", schema_version: SCHEMA.db.version, exported_at: new Date().toISOString() };
  data.deals = await idbGetAll("deals");
  for (const t of [...ROW_TABLES, ...FIXED_TABLES]) data[t] = await idbGetAll(t);
  return data;
}

function tryDownload(json) {
  try {
    const blob = new Blob([json], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const ts = new Date().toISOString().replace(/[:.]/g, "-");
    a.href = url;
    a.download = "fudosan_torihiki_backup_" + ts + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  } catch (err) { /* モーダル側のテキストからの取得にフォールバック */ }
}

function openExportModal(json) {
  const root = document.getElementById("modal-root");
  root.innerHTML =
    '<div class="modal-overlay"><div class="modal-box modal-box-wide" role="dialog" aria-modal="true" aria-labelledby="modal-title">' +
    '<h2 class="modal-title" id="modal-title">バックアップ（JSON）</h2>' +
    '<p class="modal-message">ダウンロードが始まらない場合は、下のテキストを選択してコピーしてください。</p>' +
    '<textarea id="backup-json-text" class="input textarea backup-textarea" readonly rows="14" aria-label="バックアップJSON">' + escapeHtml(json) + '</textarea>' +
    '<div class="modal-actions">' +
    '<button type="button" class="btn" data-action="modal-cancel">閉じる</button>' +
    '<button type="button" class="btn btn-primary" data-action="copy-backup-json">コピー</button>' +
    '</div></div></div>';
  focusFirstInModal();
}

async function performExport() {
  try {
    const data = await gatherBackupData();
    const json = JSON.stringify(data, null, 2);
    tryDownload(json);
    openExportModal(json);
  } catch (err) {
    showToast("書き出しに失敗しました: " + (err && err.message || String(err)), "error");
  }
}

async function copyBackupJson() {
  const ta = document.getElementById("backup-json-text");
  if (!ta) return;
  try {
    await navigator.clipboard.writeText(ta.value);
    showToast("コピーしました", "ok");
  } catch (err) {
    try {
      ta.focus(); ta.select();
      const ok = document.execCommand("copy");
      showToast(ok ? "コピーしました" : "コピーに失敗しました", ok ? "ok" : "error");
    } catch (err2) {
      showToast("コピーに失敗しました", "error");
    }
  }
}

function openImportModal() {
  const root = document.getElementById("modal-root");
  root.innerHTML =
    '<div class="modal-overlay"><div class="modal-box modal-box-wide" role="dialog" aria-modal="true" aria-labelledby="modal-title">' +
    '<h2 class="modal-title" id="modal-title">バックアップを読み込む</h2>' +
    '<div class="import-section"><label class="import-label" for="import-file-input">ファイルを選ぶ</label>' +
    '<input type="file" id="import-file-input" accept="application/json,.json"></div>' +
    '<div class="import-section"><label class="import-label" for="import-paste-text">貼り付け</label>' +
    '<textarea id="import-paste-text" class="input textarea" rows="8" placeholder="ここにバックアップのJSONを貼り付けてください"></textarea><br>' +
    '<button type="button" class="btn btn-primary" data-action="do-import-paste" style="margin-top:8px;">貼り付けた内容を読み込む</button></div>' +
    '<div class="modal-actions"><button type="button" class="btn" data-action="modal-cancel">閉じる</button></div>' +
    '</div></div>';
  const fileInput = document.getElementById("import-file-input");
  if (fileInput) fileInput.addEventListener("change", onImportFileChange);
  focusFirstInModal();
}

function onImportFileChange(e) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => handleImportJsonText(String(reader.result || ""));
  reader.onerror = () => showToast("ファイルの読み込みに失敗しました", "error");
  reader.readAsText(file);
}
function doImportPaste() {
  const ta = document.getElementById("import-paste-text");
  if (!ta || !ta.value.trim()) { showToast("JSONを貼り付けてください", "error"); return; }
  handleImportJsonText(ta.value);
}

function handleImportJsonText(text) {
  let data;
  try { data = JSON.parse(text); }
  catch (err) { showToast("読み込みに失敗しました: JSON の形式が正しくありません（" + err.message + "）", "error"); return; }
  if (!data || typeof data !== "object" || Array.isArray(data)) {
    showToast("読み込みに失敗しました: JSON はオブジェクト形式である必要があります", "error");
    return;
  }
  importData(data).then(count => {
    closeModal();
    showToast(count + "件を読み込みました", "ok");
    if (state.view === "list") renderList();
  }).catch(err => {
    showToast("読み込みに失敗しました: " + (err && err.message || String(err)), "error");
  });
}

/** rows系・fixed_rows系のいずれも「deal_idを新idへ付け替えて追加」で扱いは同じなので、
    child テーブル一覧をまとめて処理する（v0.2.0はROW_TABLES/FIXED_TABLEを別々に処理していたが、
    処理内容が同一なため統合した）。 */
function importData(data) {
  return new Promise((resolve, reject) => {
    if (!data || !Array.isArray(data.deals)) { reject(new Error("deals がありません")); return; }
    const deals = data.deals;
    const childTables = [...ROW_TABLES, ...FIXED_TABLES];
    const childArrays = {};
    childTables.forEach(t => { childArrays[t] = Array.isArray(data[t]) ? data[t] : []; });

    if (deals.length === 0) { reject(new Error("deals が0件です")); return; }

    const tx = db.transaction(ALL_STORES, "readwrite");
    let addedCount = 0;
    tx.oncomplete = () => resolve(addedCount);
    tx.onerror = () => reject(tx.error || new Error("データベースの書き込みに失敗しました"));
    tx.onabort = () => reject(tx.error || new Error("読み込み処理が中断されました"));

    const dealsStore = tx.objectStore("deals");
    deals.forEach((rec, idx) => {
      const originalId = (rec && rec.id !== undefined && rec.id !== null) ? rec.id : ("__noid_" + idx);
      const clean = (rec && typeof rec === "object") ? { ...rec } : {};
      delete clean.id;
      if (!clean.created_at) clean.created_at = new Date().toISOString();
      if (!clean.updated_at) clean.updated_at = clean.created_at;
      const req = dealsStore.add(clean);
      req.onsuccess = () => {
        const newId = req.result;
        addedCount++;
        childTables.forEach(table => {
          const store = tx.objectStore(table);
          childArrays[table].forEach(r => {
            if (!r || r.deal_id !== originalId) return;
            const c = { ...r };
            delete c.id;
            c.deal_id = newId;
            store.add(c);
          });
        });
      };
    });
  });
}

/* =========================================================================
 * 重要事項調査報告書（依頼書＝空欄／控え＝記入済み）v0.4.0
 * 06章（一棟の建物またはその敷地に関する権利およびこれらの管理・使用に関する事項）の
 * 項目はハードコードせず、SCHEMA.layout から機械的に抽出する。
 * ========================================================================= */
/** SCHEMA.layout から、重説タブの「06」見出し（level1）から次のlevel1見出しの直前までを抜き出す。
    見出し(level2/3)も含め、順序はそのまま。キー・件数ともにハードコードしない。 */
function collectReportItems() {
  const layout = SCHEMA.layout;
  let startIdx = -1;
  for (let i = 0; i < layout.length; i++) {
    const it = layout[i];
    if (it.tab === "juusetsu" && it.kind === "heading" && it.level === 1 &&
        typeof it.text === "string" && it.text.indexOf("06") === 0) {
      startIdx = i;
      break;
    }
  }
  if (startIdx === -1) return [];
  let endIdx = layout.length;
  for (let i = startIdx + 1; i < layout.length; i++) {
    if (layout[i].kind === "heading" && layout[i].level === 1) { endIdx = i; break; }
  }
  return layout.slice(startIdx, endIdx);
}

/** ヘッダーの物件行に使う候補キー。SCHEMAに存在し、値があるものだけを採用する。 */
const REPORT_PROPERTY_KEYS = ["bldg_name", "bldg_room_number", "bldg_location"];
/** フッターの管理会社記入欄に使う候補キー。SCHEMAに存在するものだけを採用する。 */
const REPORT_FOOTER_KEYS = ["mgmt_company_name", "mgmt_company_tel", "mgmt_company_reg_number"];
/** ヘッダーの依頼元に使う候補キー。SCHEMAに存在し、値があるものだけを採用する。 */
const REPORT_REQUESTER_KEYS = ["agent_company_name", "agent_office_address", "agent_staff_name", "agent_staff_tel", "agent_license_number"];

function reportTodayJP() {
  const d = new Date();
  return d.getFullYear() + "年" + (d.getMonth() + 1) + "月" + d.getDate() + "日";
}

/** <input type="date"> 由来の "YYYY-MM-DD" を「YYYY年M月D日」に整形する。 */
function formatDateJP(v) {
  if (!v) return "";
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(v));
  if (!m) return String(v);
  return Number(m[1]) + "年" + Number(m[2]) + "月" + Number(m[3]) + "日";
}

/** 報告書の値セル整形。money=3桁区切り＋「円」、date=YYYY年M月D日、yesno=保存値そのまま、
    number=3桁区切り＋unitがあれば付ける。それ以外の型は保存値をそのまま文字列化する。 */
function formatReportFieldValue(def, value) {
  if (value === null || value === undefined || value === "") return "";
  if (def.type === "money") return formatMoney(value) + "円";
  if (def.type === "date") return formatDateJP(value);
  if (def.type === "yesno") return String(value);
  if (def.type === "number") return formatMoney(value) + (def.unit || "");
  return String(value);
}

function renderReportHeading(item) {
  const cls = item.level === 1 ? "report-h1" : (item.level === 2 ? "report-h2" : "report-h3");
  return '<div class="' + cls + '">' + escapeHtml(item.text) + '</div>';
}

function renderReportFieldRow(def, mode) {
  const raw = state.deal ? state.deal[def.key] : "";
  const disp = (mode === "filled") ? formatReportFieldValue(def, raw) : "";
  const valueHtml = disp ?
    ('<span class="report-value-text">' + escapeHtml(disp) + '</span>') :
    '<span class="report-blank-line" aria-hidden="true"></span>';
  return '<div class="report-field-row"><div class="report-label">' + escapeHtml(def.label) +
    '</div><div class="report-value">' + valueHtml + '</div></div>';
}

function renderReportDataCell(def, row, mode) {
  const raw = row ? row[def.key] : "";
  const disp = (mode === "filled") ? formatReportFieldValue(def, raw) : "";
  return '<td>' + (disp ? escapeHtml(disp) : '<span class="report-blank-line" aria-hidden="true"></span>') + '</td>';
}

/** kind: "rows" / "fixed_rows" の表を、その表の列見出しつきで出す。
    rows は blank なら空行を3行、filled なら state.rows[table] の実データ。
    fixed_rows は行そのもの（対象カテゴリ）がSCHEMA固定のため、常に全カテゴリ分の行を出し、
    値セルのみ blank/filled で切り替える。 */
function renderReportRowsTable(item, mode) {
  const table = item.table;
  const defs = SCHEMA.row_fields[table] || [];
  const headCells = defs.map(d =>
    '<th>' + escapeHtml(d.label) + (d.unit ? ('（' + escapeHtml(d.unit) + '）') : '') + '</th>'
  ).join("");
  let bodyHtml;
  if (item.kind === "fixed_rows") {
    const order = FIXED_ORDER_BY_TABLE[table] || [];
    const dataRows = state.fixed[table] || [];
    const headerLabel = FIXED_HEADER_LABEL[table] || "種別";
    const theadHtml = '<th>' + escapeHtml(headerLabel) + '</th>' + headCells;
    bodyHtml = order.map((typeLabel, idx) => {
      const row = dataRows[idx] || null;
      const cells = '<td class="report-fixed-type-cell">' + escapeHtml(typeLabel) + '</td>' +
        defs.map(d => renderReportDataCell(d, row, mode)).join("");
      return '<tr>' + cells + '</tr>';
    }).join("");
    return '<table class="report-table"><thead><tr>' + theadHtml + '</tr></thead><tbody>' + bodyHtml + '</tbody></table>';
  }
  const rows = (mode === "filled") ? (state.rows[table] || []) : [null, null, null];
  bodyHtml = rows.map(row => '<tr>' + defs.map(d => renderReportDataCell(d, row, mode)).join("") + '</tr>').join("");
  return '<table class="report-table"><thead><tr>' + headCells + '</tr></thead><tbody>' + bodyHtml + '</tbody></table>';
}

/** 06章には現れない想定だが、来た場合はラベル一覧を□付きで出す（チェック状態は反映しない）。 */
function renderReportChecklist(item) {
  const itemsHtml = (item.items || []).map(label =>
    '<div class="report-check-item">□' + escapeHtml(label) + '</div>'
  ).join("");
  return '<div class="report-checklist"><div class="report-checklist-label">' + escapeHtml(item.label) + '</div>' +
    '<div class="report-checklist-grid">' + itemsHtml + '</div></div>';
}

function buildReportHtml(mode) {
  const deal = state.deal || {};
  const items = collectReportItems();
  const titleSuffix = (mode === "blank") ? "（調査依頼書）" : "（控え）";

  const propertyParts = REPORT_PROPERTY_KEYS
    .filter(k => DEAL_FIELD_DEFS[k])
    .map(k => deal[k])
    .filter(v => v !== null && v !== undefined && v !== "");
  const propertyHtml = propertyParts.length ?
    ('<div class="report-meta">物件：' + escapeHtml(propertyParts.join("　")) + '</div>') : "";

  // 依頼元: 値のあるキーだけ、ラベル｜値の行として出す。依頼元は自分の情報なので
  // mode（blank/filled）に関わらず常に値を出す（renderReportFieldRow を "filled" 固定で呼ぶ）。
  const requesterRows = REPORT_REQUESTER_KEYS
    .filter(k => DEAL_FIELD_DEFS[k])
    .filter(k => deal[k] !== null && deal[k] !== undefined && deal[k] !== "")
    .map(k => renderReportFieldRow(DEAL_FIELD_DEFS[k], "filled"))
    .join("");
  const requesterHtml = requesterRows ?
    ('<div class="report-requester"><div class="report-requester-title">依頼元</div>' + requesterRows + '</div>') : "";

  const headerHtml = '<div class="report-header">' +
    '<div class="report-title">重要事項調査報告書' + escapeHtml(titleSuffix) + '</div>' +
    '<div class="report-meta">作成日：' + escapeHtml(reportTodayJP()) + '</div>' +
    propertyHtml +
    requesterHtml +
    '</div>';

  const bodyHtml = items.map(item => {
    if (item.kind === "heading") return renderReportHeading(item);
    if (item.kind === "field") return renderReportFieldRow(item, mode);
    if (item.kind === "rows" || item.kind === "fixed_rows") return renderReportRowsTable(item, mode);
    if (item.kind === "checklist") return renderReportChecklist(item);
    return "";
  }).join("");

  const footerRows = REPORT_FOOTER_KEYS.filter(k => DEAL_FIELD_DEFS[k]).map(k => renderReportFieldRow(DEAL_FIELD_DEFS[k], mode)).join("");
  const footerHtml = footerRows ?
    ('<div class="report-footer"><div class="report-footer-title">管理会社 記入欄</div>' + footerRows + '</div>') : "";

  return '<div class="report-doc">' + headerHtml + '<div class="report-body">' + bodyHtml + '</div>' + footerHtml + '</div>';
}

/** 印刷ビューを組み立てて印刷ダイアログを開く。ダイアログが閉じたら元に戻す。 */
function openReport(mode) {
  const view = document.getElementById("report-view");
  view.innerHTML = buildReportHtml(mode);
  document.body.classList.add("printing");
  window.onafterprint = () => {
    document.body.classList.remove("printing");
    view.innerHTML = "";
    window.onafterprint = null;
  };
  window.print();
}

/* =========================================================================
 * 重要事項説明書: 幾何データから25ページを生成する。
 * 未確定の建築時期分解・特約の割当・対応のないチェックは推測しない。
 * ========================================================================= */
function jpEmpty(value) {
  return value === null || value === undefined || value === "" || value === false;
}
function jpDefinition(bind) {
  if (!bind) return {};
  return bind.key ? (DEAL_FIELD_DEFS[bind.key] || {}) :
    ((SCHEMA.row_fields[bind.table] || []).find(d => d.key === bind.col) || {});
}

  if (!bind) return "";
  if (bind.key) return state.deal[bind.key] ?? "";
  if (bind.table && bind.col) return (state.rows[bind.table] || state.fixed[bind.table] || [])[bind.row]?.[bind.col] ?? "";
  return "";
}

  return slot.bind?.key === "unit_built_period" || slot.bind?.key === "special_terms";
}
function jpChoice(bind) {
  const value = jpValue(bind);
  if (jpDefinition(bind).type !== "yesno") return value;
  return value === "あり" ? "有" : value === "なし" ? "無" : value;
}
function jpTableOption(page, slot) {
  // 生成器で行・列の割当が重複した4枠は、正本の修正まで印字を保留する。
  if (["p12-cb14", "p12-cb15", "p12-cb28", "p12-cb29"].includes(slot.id)) return undefined;
  const contains = (text, box) => Math.abs(text.y - box.y) < 1 && text.x <= box.x && box.x < text.x + text.w;
  const texts = page.static.filter(t => t.text.includes("□") && contains(t, slot));
  if (texts.length !== 1) return undefined;
  const text = texts[0];
  const boxes = page.slots.filter(s => s.kind === "checkbox" && contains(text, s)).sort((a,b) => a.x - b.x);
  const index = boxes.findIndex(s => s.id === slot.id);
  const labels = text.text.split("□").slice(1);
  if (labels.length !== boxes.length || index < 0) return undefined;
  const label = labels[index].trim().replace(/^\d+[.．]\s*/, "");
  const def = jpDefinition(slot.bind);
  if (def.type === "yesno") return /^[有無]/.test(label) ? label[0] : undefined;
  const choices = (def.options || []).filter(option => label.startsWith(option));
  if (choices.length === 1) return choices[0];
  if (def.type === "text" && label && !/[□（）()・]/.test(label)) return label;
  return undefined;
}
function jpChecked(slot, page) {
  const b = slot.bind;
  if (!b) return false;
  if (b.checklist) {
    const item = CHECKLIST_DEFS[b.checklist]?.items[b.item];
    return item !== undefined && (state.deal[b.checklist] || []).includes(item);
  }
  if (slot.id === "p19-cb14") {
    const value = String(state.deal.ii_penalty_type ?? "");
    return value.startsWith("売買代金の") && /[%％]相当額$/.test(value);
  }
  if (b.option !== undefined) return jpChoice(b) === b.option;
  if (b.table) {
    const option = jpTableOption(page, slot);
    return option !== undefined && jpChoice(b) === option;
  }
  return jpDefinition(b).type === "checkbox" && jpValue(b) === true;
}
function jpDatePart(value, part) {
  const text = String(value);
  const match = text.match(/^(\d{4})[-/年](\d{1,2})(?:[-/月](\d{1,2}|末))?/);
  if (!match) return "";
  const year = Number(match[1]), month = Number(match[2]);
  const day = match[3] === "末" ? "末" : match[3] ? String(Number(match[3])) : "";
  if (part === "year") return String(year);
  if (part === "month") return String(month);
  if (part === "day") return day;
  if (part === "date") return year + "年" + month + "月" + (day ? day + "日" : "");
  if (part === "era_year") {
    const date = new Date(year, month - 1, day && day !== "末" ? Number(day) : 1);
    const parts = new Intl.DateTimeFormat("ja-JP-u-ca-japanese", { era:"long", year:"numeric" }).formatToParts(date);
    return parts.filter(p => p.type === "era" || p.type === "year").map(p => p.value).join("");
  }
  return text;
}
function jpFormat(slot) {
  const b = slot.bind;
  if (!b || jpUnresolved(slot) || b.marker) return "";
  if (b.checklist) {
    const label = CHECKLIST_DEFS[b.checklist]?.items[b.item] || "";
    if (!(state.deal[b.checklist] || []).includes(label)) return "";
    if (b.part === "number") return String(b.item + 1);
    if (b.part === "label") return label.replace(/^\d+[.．]?\s*/, "");
    return "";
  }
  if (b.compose) {
    if (b.compose.every(k => jpEmpty(state.deal[k]))) return "";
    let fmt = b.fmt || "";
    fmt = fmt.replace(/\[([^\]]*)\]/g, (_, optional) =>
      Number(state.deal.bldg_basement_floors) > 0 ? optional : "");
    return fmt.replace(/\{([^}]+)\}/g, (_, key) => state.deal[key] ?? "");
  }
  const value = jpValue(b), def = jpDefinition(b);
  const money = slot.fmt === "money_kin" || def.type === "money";
  if (jpEmpty(value)) {
    if (money) return "金----";
    if (slot.kind === "strike") return "-".repeat(Math.max(1, Math.floor(slot.w / (slot.size * 0.5))));
    return "";
  }
  if (b.part === "percent") return String(value).match(/([\d.]+)\s*[%％]/)?.[1] || "";
  if (b.part && b.part !== "continued") return jpDatePart(value, b.part);
  if (money) return "金" + formatMoney(value);
  if (slot.fmt === "area2" || (def.type === "number" && def.unit === "㎡")) {
    const total = b.key === "bldg_total_floor_area" || b.key === "land_parcel_area_total";
    return Number(value).toLocaleString("ja-JP", { useGrouping:total, minimumFractionDigits:2, maximumFractionDigits:2 });
  }
  if (b.fmt) return b.fmt.replace("{v}", String(value));

function jpIsMultiline(slot) {
  if (slot.kind !== "text" || !slot.bind || jpUnresolved(slot)) return false;
  if (slot.flow?.kind === "rows") return false;
  return !!slot.multiline || slot.flow?.kind === "wrap" || jpDefinition(slot.bind).type === "textarea";
}
function jpTextIdentity(bind) {
  return bind.key ? "key:" + bind.key : "table:" + bind.table + ":" + bind.row + ":" + bind.col;
}
function jpWrap(text, charsPerLine) {
  const width = Math.max(1, charsPerLine * 2), result = [];
  String(text).replace(/\r\n?/g, "\n").split("\n").forEach(paragraph => {
    let line = "", used = 0;
    for (const ch of paragraph) {
      const n = /[\u0000-\u007f\uff61-\uff9f]/.test(ch) ? 1 : 2;
      if (used + n > width && line) { result.push(line); line = ""; used = 0; }
      line += ch; used += n;
    }
    result.push(line);
  });
  return result;
}
function jpTextLayout() {
  const groups = new Map(), values = new Map(), warnings = [];
  JUUSETSU_GEOMETRY.pages.forEach(page => page.slots.forEach(slot => {
    if (!jpIsMultiline(slot) || (slot.flow?.kind === "wrap" && slot.flow.line !== 0 && slot.id !== "p8-t6-1")) return;
    const identity = jpTextIdentity(slot.bind);
    if (!groups.has(identity)) groups.set(identity, []);
    groups.get(identity).push({ page:page.no, slot });
  }));
  groups.forEach(blocks => {
    blocks.sort((a,b) => a.page - b.page || a.slot.y - b.slot.y);
    const first = blocks[0].slot, raw = jpValue(first.bind);
    const prose = jpDefinition(first.bind).type === "textarea";
    let remaining = jpEmpty(raw) ? (prose ? "余白" : "") : String(raw);
    let lastLines = [], lastCapacity = 0;
    blocks.forEach((block, i) => {
      const s = block.slot, cap = s.capacity;
      let height = Math.min(cap.height_pt, s.cell?.h ?? cap.height_pt);
      let count = cap.lines;
      const next = blocks[i + 1];
      // 同じセル内の続きスロットは領域を重複して数えない。
      if (next && next.page === block.page && next.slot.y > s.y && next.slot.y < s.y + height) {
        height = Math.min(height, next.slot.y - s.y);
        count = Math.min(count, Math.max(1, Math.floor((next.slot.y - s.y) / cap.lh)));
      }
      height = count * cap.lh;
      const width = Math.min(s.align === "right" ? s.w : cap.width_pt, s.cell?.w ?? cap.width_pt);
      const chars = Math.min(cap.chars_per_line, Math.floor(width / s.size));
      const lines = remaining ? jpWrap(remaining, chars) : [];
      values.set(s.id, { text:lines.slice(0, count).join("\n"), width, height, lh:cap.lh });
      remaining = lines.slice(count).join("\n");
      lastLines = lines; lastCapacity = count;
    });
    if (!remaining && !jpEmpty(raw) && prose) {
      const last = blocks.map(b => values.get(b.slot.id)).filter(b => b.text).pop();
      if (last) last.text += "以下余白";
    }
    if (remaining) {
      const b = blocks[blocks.length - 1];
      const def = jpDefinition(first.bind);
      const label = first.bind.table ? TABLE_LABELS[first.bind.table] + " " + (Number(first.bind.row) + 1) + "行目 " + def.label : def.label;
      warnings.push({ page:b.page, label:label || first.bind.key || first.bind.col, excess:lastLines.length - lastCapacity });

function jpTableLength(table) {
  const rows = state.rows[table] || state.fixed[table] || [];

  let length = 0;
  rows.forEach((row, i) => { if (defs.some(d => !jpEmpty(row[d.key]))) length = i + 1; });
  return length;
}
function jpTableMarkers() {
  const markers = new Set();
  Object.entries(JUUSETSU_GEOMETRY.table_capacity).forEach(([table, limit]) => {
    const row = jpTableLength(table);
    if (row >= limit) return;
    const tableSlots = JUUSETSU_GEOMETRY.pages.flatMap(p => p.slots).filter(s =>
      s.kind === "text" && s.bind?.table === table);
    const marker = tableSlots.find(s => s.bind.row === row && s.bind.marker);
    if (marker) { markers.add(marker.id); return; }
    const content = tableSlots.filter(s => s.bind.col).sort((a,b) => a.x - b.x || a.y - b.y)[0];
    const slot = tableSlots.filter(s => s.bind.row === row && s.bind.col === content?.bind.col).sort((a,b) => a.y - b.y || a.x - b.x)[0];
    if (slot) markers.add(slot.id);
  });
  return markers;
}
function jpTextHtml(slot, text, block) {
  if (!text) return "";
  let style = "left:" + slot.x + "pt;top:" + slot.y + "pt;font-size:" + slot.size + "pt;";
  if (block) style += "width:" + block.width + "pt;height:" + block.height + "pt;line-height:" + block.lh + "pt;white-space:pre-wrap;overflow:hidden;overflow-wrap:anywhere;";
  else if (slot.w) style += "width:" + slot.w + "pt;";
